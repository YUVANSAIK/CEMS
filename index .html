<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Event Manager</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .sidebar {
      position: fixed;
      width: 220px;
      height: 100vh;
      padding: 24px 16px;
      background: #244739;
      color: white;
    }

    .sidebar h2 {
      margin: 0 0 30px;
    }

    .sidebar a {
      display: block;
      margin: 8px 0;
      padding: 12px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #35634d;
    }

    .main {
      margin-left: 220px;
      padding: 32px;
    }

    .card {
      margin: 16px 0;
      padding: 18px;
      border-radius: 8px;
      background: white;
      box-shadow: 0 2px 6px #0001;
    }

    @media (max-width: 600px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .sidebar a {
        display: inline-block;
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2>Campus Events</h2>
    <a href="#dashboard" class="active">Dashboard</a>
    <a href="#profile">Profile</a>
    <a href="#events">Events</a>
  </aside>

  <main class="main">
    <section id="dashboard">
      <h1>Dashboard</h1>
      <p>Welcome to your college event management system.</p>
    </section>

    <section id="profile" class="card">
      <h2>Profile</h2>
      <p><strong>Name:</strong> Student Name</p>
      <p><strong>Email:</strong> student@example.com</p>
    </section>

    <section id="events" class="card">
      <h2>Events</h2>
      <p>There are no events to display yet.</p>
    </section>
  </main>
</body>
</html>
